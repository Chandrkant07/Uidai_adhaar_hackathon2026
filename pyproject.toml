[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aadhaarpulse"
version = "0.1.0"
description = "AadhaarGyan – India’s Identity & Service Intelligence Engine (UIDAI Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pydantic>=2.6",
  "tqdm>=4.66",
  "streamlit>=1.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
